# SGC-YOLOv5s。未写的键沿用 configs/global.toml。
# 切换规模：--set model.params.variant=n / m / l / x

[experiments]
name = "2026-10-30_003_SGC_YOLOv5s_V1"
description = "SGC-YOLOv5s from scratch | Det_Fly | Mosaic + flip | SGD 0.01 + warmup + linear | 300 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5"

[model.params]
variant = "m"                # 规模：n / s / m / l / x

[hyperparameters]
num_epochs = 300             # 与 yolov5s 保持一致，便于对比
# anchors = [[10,13,16,30,33,23],[30,61,62,45,59,119],[116,90,156,198,373,326]]  # 留空则用官方默认锚框
