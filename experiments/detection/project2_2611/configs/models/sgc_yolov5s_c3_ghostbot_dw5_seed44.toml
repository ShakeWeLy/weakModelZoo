# 与 sgc_yolov5s_c3_ghostbot_dw5 相同，仅 seed=44（40 epoch）。

[experiments]
name = "2026-11-19_035_SGC_c3_ghostbot_dw5_s_seed44_V1"
description = "c3_ghostbot DW=5 + Conv↓ | seed 44 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_ghostbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "conv"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"

[hyperparameters]
num_epochs = 40

[train]
seed = 44