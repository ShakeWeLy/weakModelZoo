# 从 c3topo_1 加回 Ghost：仅把下采样 Conv→SGhost；其余不变。
# C3拓扑 + proj=conv + dense-bot + SGhost↓ + VOVGCSPYolo
# 对照：c3topo_1（Conv↓）

[experiments]
name = "2026-11-12_024_SGC_c3_sgdown_s_V1"
description = "Ghost-back A: c3topo_1 but downsample=sghost only"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown"

[model.params]
variant = "s"
kernel_size = 1
dw_kernel_size = 1
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "dense"
csp_style = "yolo"

[hyperparameters]
num_epochs = 40
