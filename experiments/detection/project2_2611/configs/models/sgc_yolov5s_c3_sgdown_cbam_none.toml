# 与 c3_sgdown 相同，去掉输出前全部 CBAM（P3/P4/P5）。seed 42，40 epoch。

[experiments]
name = "2026-11-20_036_SGC_c3_sgdown_s_cbamNone_seed42_V1"
description = "c3_sgdown + SGhost↓ | no CBAM | seed 42 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown"

[model.params]
variant = "s"
kernel_size = 1
dw_kernel_size = 1
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "dense"
csp_style = "yolo"
cbam_mode = "none"

[hyperparameters]
num_epochs = 40

[train]
seed = 42