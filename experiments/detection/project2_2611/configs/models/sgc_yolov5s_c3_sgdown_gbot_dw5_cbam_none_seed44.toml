# 结构消融 CBAM-none：与 sgc_yolov5s_c3_sgdown_gbot_dw5_cbam_none 完全相同，仅 seed=44（40 epoch）。

[experiments]
name = "2026-11-19_022_SGC_c3_sgdown_gbot_dw5_s_cbamNone_seed44_V1"
description = "c3_sgdown + ghost-bot dw5 | no CBAM at all scales | seed 44 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"
cbam_mode = "none"

[hyperparameters]
num_epochs = 40

[train]
seed = 44