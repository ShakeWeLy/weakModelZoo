# Ghost 本征占比消融：intrinsic_ratio=0.625（5/8），其余与 sgc_yolov5s_c3_sgdown_gbot_dw5 相同（seed=42，40 epoch）。
# 本征通道 = ceil(out × 0.625)，幽灵通道 = out − 本征；0.5 对应原 ratio=2（已验证结构与权重完全一致）。
# ratio 仍保留为 2：SDGhost 隐藏宽度对齐与 Neck 的 GSConv 仍依赖整数 ratio。

[experiments]
name = "2026-11-17_009_SGC_c3_sgdown_gbot_dw5_s_ir0625_seed42_V1"
description = "c3_sgdown + ghost-bot dw5 | Ghost intrinsic ratio 0.625 | seed 42 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
intrinsic_ratio = 0.625
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"

[hyperparameters]
num_epochs = 40

[train]
seed = 42
