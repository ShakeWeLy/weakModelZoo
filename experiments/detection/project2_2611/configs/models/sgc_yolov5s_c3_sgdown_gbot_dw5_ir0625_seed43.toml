# Ghost 本征占比消融：intrinsic_ratio=0.625，仅 seed=43（40 epoch）。与 sgc_yolov5s_c3_sgdown_gbot_dw5_ir0625 完全相同。

[experiments]
name = "2026-11-17_010_SGC_c3_sgdown_gbot_dw5_s_ir0625_seed43_V1"
description = "c3_sgdown + ghost-bot dw5 | Ghost intrinsic ratio 0.625 | seed 43 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
intrinsic_ratio = 0.625
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"

[hyperparameters]
num_epochs = 40

[train]
seed = 43
