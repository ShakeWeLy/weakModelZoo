# 结构消融 noDFC：Ghost 瓶颈去掉 DFC 门控（x = x1，不乘门控），其余不变（40 epoch，seed 42）。
# 用于回答：门控是否带来精度，以及去掉后的延迟收益。

[experiments]
name = "2026-11-17_007_SGC_c3_sgdown_gbot_dw5_s_noDFC_V1"
description = "c3_sgdown + ghost-bot dw5 | no DFC gate in ghost bottleneck | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"
use_dfc = false

[hyperparameters]
num_epochs = 40

[train]
seed = 42
