# 训练期 no ChannelShuffle，与 seed44 的 017（有 Shuffle）对照。

[experiments]
name = "2026-11-21_039_SGC_c3_sgdown_gbot_dw5_s_noDFC_cbamNone_noShuffle_seed44_V1"
description = "c3_sgdown + ghost-bot dw5 | no DFC + no CBAM + no ChannelShuffle | seed 44 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"
use_dfc = false
cbam_mode = "none"
use_shuffle = false

[hyperparameters]
num_epochs = 40

[train]
seed = 44