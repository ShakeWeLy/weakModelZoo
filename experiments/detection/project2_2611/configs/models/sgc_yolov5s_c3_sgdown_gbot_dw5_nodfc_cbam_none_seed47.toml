# 无 DFC + 无 CBAM，与 nodfc_cbam_none 相同，仅 seed=47（40 epoch）。

[experiments]
name = "2026-11-21_035_SGC_c3_sgdown_gbot_dw5_s_noDFC_cbamNone_seed47_V1"
description = "c3_sgdown + ghost-bot dw5 | no DFC + no CBAM | seed 47 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"
use_dfc = false
cbam_mode = "none"

[hyperparameters]
num_epochs = 40

[train]
seed = 47