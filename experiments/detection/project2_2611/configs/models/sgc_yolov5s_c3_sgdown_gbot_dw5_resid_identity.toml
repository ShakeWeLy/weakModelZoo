# 结构消融 residual-identity：Ghost 瓶颈的残差支路由 3×3 深度卷积改为恒等捷径，其余不变（40 epoch，seed 42）。

[experiments]
name = "2026-11-17_008_SGC_c3_sgdown_gbot_dw5_s_residIdentity_V1"
description = "c3_sgdown + ghost-bot dw5 | residual = identity instead of 3x3 DW | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"
res_type = "identity"

[hyperparameters]
num_epochs = 40

[train]
seed = 42
