# 与 c3_sgdown_gbot_dw5 基线相同，仅 seed=45（40 epoch）。

[experiments]
name = "2026-11-20_030_SGC_c3_sgdown_gbot_dw5_s_seed45_V1"
description = "c3_sgdown + ghost-bot dw5 | seed 45 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw5"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 5
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"
dfc_type = "strip"

[hyperparameters]
num_epochs = 40

[train]
seed = 45