# 在 c3_sgdown 基础上再加 ghost-bot，且 3×3 段廉价 DW=7。
# C3拓扑 + proj=conv + ghost-bot(mid_dw=7) + SGhost↓ + VOVGCSPYolo
# 对照：c3_sgdown_gbot_dw5 / c3_ghostbot_dw7

[experiments]
name = "2026-11-13_030_SGC_c3_sgdown_gbot_dw7_s_V1"
description = "c3_sgdown + ghost-bot with mid-layer Ghost DW=7"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw7"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 7
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"

[hyperparameters]
num_epochs = 40
