# 与 sgc_yolov5s_c3_sgdown_gbot_dw7 相同，仅 seed=43（40 epoch）。

[experiments]
name = "2026-11-19_028_SGC_c3_sgdown_gbot_dw7_s_seed43_V1"
description = "c3_sgdown + ghost-bot DW=7 | seed 43 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3_sgdown_gbot_dw7"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
mid_dw_kernel_size = 7
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "sghost"
proj_type = "conv"
bottleneck_type = "ghost"
csp_style = "yolo"

[hyperparameters]
num_epochs = 40

[train]
seed = 43