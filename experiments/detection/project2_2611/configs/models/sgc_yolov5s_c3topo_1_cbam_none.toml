# 与 c3topo_1 相同，去掉输出前全部 CBAM。seed 42，40 epoch。

[experiments]
name = "2026-11-20_039_SGC_c3topo_1_s_cbamNone_seed42_V1"
description = "c3topo_1 + Conv↓ | no CBAM | seed 42 | 40 epochs"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3topo_1"

[model.params]
variant = "s"
kernel_size = 1
dw_kernel_size = 1
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "conv"
proj_type = "conv"
bottleneck_type = "dense"
csp_style = "yolo"
cbam_mode = "none"

[hyperparameters]
num_epochs = 40

[train]
seed = 42