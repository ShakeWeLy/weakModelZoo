# C3 拓扑消融 3：在 c3topo_2 上把 Bottleneck 改回 Ghost。
# Conv↓ + SDGhost(e=0.5, csp=yolo, proj=ghost, ghost-bot) + VOVGCSPYolo
# 对照：c3topo_2 / m2l_3（residual + ghost-bot）

[experiments]
name = "2026-11-12_023_SGC_c3topo_3_s_V1"
description = "C3topo step3: Conv-down + SDGhost(csp=yolo,proj=ghost,ghost-bot) + VOVGCSPYolo"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_c3topo_3"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
downsample_type = "conv"
proj_type = "ghost"
bottleneck_type = "ghost"
csp_style = "yolo"

[hyperparameters]
num_epochs = 40
