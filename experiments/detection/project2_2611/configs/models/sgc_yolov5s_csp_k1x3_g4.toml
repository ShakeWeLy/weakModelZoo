# 参数消融 J：在 I（1×1→3×3, dw=1, g=4）基础上，SDGhost 改为 CSP 窄通道：
#   GBS1(1×1) C→C/2 → Bottleneck(Ghost 1×1→3×3) → GBS2(1×1) C/2→C
# 对照：sgc_yolov5s_k1x3_g4（I，满通道）/ sgc_yolov5s_k3_g4（G）/ YOLOv5s

[experiments]
name = "2026-11-09_013_SGC_csp_k1x3_g4_s_V1"
description = "Param ablation J: CSP e=0.5 SDGhost + YOLO-style 1x1->3x3 | Det_Fly | same recipe as SGC V4"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_csp_k1x3_g4"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
groups_ratio = 4
ratio = 2
e = 0.5

[hyperparameters]
num_epochs = 40
