# 参数消融 I：在 G（dw=1, g=4）基础上，Bottleneck/GSBottleneck 改为 YOLO 式 1×1 → 3×3。
# kernel_size=1（第一层/GBS），mid_kernel_size=3（第二层空间卷积）。
# 对照：sgc_yolov5s_k3_g4（G，双层均为 3×3）/ YOLOv5s

[experiments]
name = "2026-11-08_012_SGC_k1x3_g4_s_V1"
description = "Param ablation I: G recipe but YOLO-style 1x1->3x3 bottleneck | Det_Fly | same recipe as SGC V4"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_k1x3_g4"

[model.params]
variant = "s"
kernel_size = 1
mid_kernel_size = 3
dw_kernel_size = 1
groups_ratio = 4
ratio = 2

[hyperparameters]
num_epochs = 40
