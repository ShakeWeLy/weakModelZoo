# 消融 N：在 L 基础上，仅把 SDGhost 内 Ghost Bottleneck 换成 YOLO 稠密 1×1→3×3。
# GBS / 下采样 SGhost / Neck(VOVGCSPYolo+GSConv+CBAM) 均不动。
# 对照：sgc_yolov5s_j_vovyolo（L）/ sgc_yolov5s_stdbb_vovyolo（M）

[experiments]
name = "2026-11-11_017_SGC_l_densebot_s_V1"
description = "Ablation N: L recipe but dense YOLO Bottleneck in SDGhost | Det_Fly | same recipe as SGC V4"

[model]
arch = "sgc_yolov5"
display_name = "SGC_YOLOv5_l_densebot"

[model.params]
variant = "s"
kernel_size = 1
dw_kernel_size = 1
groups_ratio = 4
ratio = 2
e = 0.5
vov_style = "yolo"
bottleneck_type = "dense"

[hyperparameters]
num_epochs = 40
