[experiments]
name = "2026-09-23_001_AttnUNet"
date = "2026-09-23"
description = "first attnunet experiment"
runs_dir = "runs"

[dataset]
image_size = 224
batch_size = 8
num_workers = 1

[hyperparameters]
learning_rate = 0.05
weight_decay = 0.0001
num_epochs = 300
momentum = 0.9
optimizer = "sgd"

[model]
hidden_channels = 64
class_nums = 14

[train]
data_dir = "data/synapse_processed"
device = "cuda"

[test]
data_dir = "data/synapse_processed"
device = "cuda"
splits = ["train", "val", "test"]
save_predictions = true
save_predictions_splits = ["val"]
save_visualizations = true
save_visualizations_splits = ["val", "test"]
visualize_num = 5
