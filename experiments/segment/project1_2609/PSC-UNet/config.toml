[experiments]
name = "2026-09-27_006_PSC-UNet_V2"
date = "2026-09-27"
description = "V1 + stronger regularization: dropout=0.15, weight_decay=1e-3 (vs V1 dropout=0.1, weight_decay=1e-4)."
runs_dir = "runs"

[dataset]
image_size = 224
batch_size = 8
num_workers = 1
# 训练集数据增强（验证/测试不启用）
augment = true
flip_horizontal = true
flip_vertical = true
rotate = true
intensity_jitter = true
intensity_scale = [0.9, 1.1]
intensity_shift = [-0.1, 0.1]
gaussian_noise_std = 0.02

[hyperparameters]
learning_rate = 0.0001
weight_decay = 0.001
num_epochs = 300
momentum = 0.9
optimizer = "adam"

[model]
base_dim = 32
class_nums = 9
in_channels = 1
swin_depths = [1, 1, 1, 1]
repeat_gray_to_rgb = false
dropout = 0.15
# 将原始 14 类 GT 映射为 9 类（背景 + 8 器官）；非 8 器官像素视为背景
label_map = "eval8"

[train]
data_dir = "data/synapse_processed"
device = "cuda"
class_metrics_every = 10
class_metrics_splits = ["val", "train"]
# 模型空间 class 1..8，对应 spleen/rk/lk/gb/liver/stomach/aorta/pancreas
val_metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]
metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]
dice_class_weights = [1, 1, 1, 1, 1, 1, 1, 1]
# 组合损失: loss = dice_loss_weight * Dice + ce_loss_weight * CE
dice_loss_weight = 1.0
ce_loss_weight = 1.0
# CE 类别权重；未设置时自动使用 [1.0] + dice_class_weights
# ce_class_weights = [1, 1, 1, 1, 1, 1, 1, 1, 1]
skip_absent_classes = false
guaranteed_sampling = false
early_stopping_patience = 50
early_stopping_min_delta = 0.0

[test]
data_dir = "data/synapse_processed"
device = "cuda"
splits = ["train", "val", "test"]
save_predictions = true
save_predictions_splits = ["train", "val", "test"]
save_visualizations = true
save_visualizations_splits = ["train", "val", "test"]
visualize_num = 50
