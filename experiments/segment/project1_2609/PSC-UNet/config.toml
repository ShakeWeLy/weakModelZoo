[experiments]
name = "2026-10-07_001_PSC-UNet_V1"
date = "2026-10-07"
description = "V1: Fix dataset."
runs_dir = "runs"

[dataset]
format = "transunet"
image_size = 224
batch_size = 8
num_workers = 0
# TransUNet 管线：RandomGenerator（与 Swin-Unet 一致）；下方 flip/intensity 仅 modelzoo 格式生效
augment = true
list_dir = "F:/myproject/weakUnet/Swin-Unet/lists/lists_Synapse"
flip_horizontal = true
flip_vertical = true
rotate = true
intensity_jitter = true
intensity_scale = [0.9, 1.1]
intensity_shift = [-0.1, 0.1]
gaussian_noise_std = 0.02

[hyperparameters]
learning_rate = 0.0001
weight_decay = 0.001
num_epochs = 300
momentum = 0.9
optimizer = "adam"
lr_scheduler = "cosine"
lr_min = 0.000001

[model]
base_dim = 32
class_nums = 9
in_channels = 1
swin_depths = [1, 1, 1, 1]
repeat_gray_to_rgb = false
dropout = 0.15
# TransUNet npz 标签已是 0..8，无需 eval8
label_map = ""

[train]
data_dir = "F:/myproject/weakUnet/data/Synapse"
val_holdout_cases = 2
device = "cuda"
class_metrics_every = 10
class_metrics_splits = ["val", "train"]
val_metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]
metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]
dice_class_weights = [1, 1, 1, 1, 1, 1, 1, 1]
dice_loss_weight = 1.0
ce_loss_weight = 1.0
skip_absent_classes = true
guaranteed_sampling = false
min_samples_per_group_per_epoch = 8
early_stopping_patience = 80
early_stopping_min_delta = 0.0

[test]
data_dir = "F:/myproject/weakUnet/data/Synapse"
list_dir = "F:/myproject/weakUnet/Swin-Unet/lists/lists_Synapse"
device = "cuda"
splits = ["train", "val", "test"]
save_predictions = true
save_predictions_splits = ["val", "test"]
save_visualizations = true
save_visualizations_splits = ["val", "test"]
visualize_num = 100
