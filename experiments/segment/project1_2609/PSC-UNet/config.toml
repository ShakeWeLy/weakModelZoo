[experiments]
name = "2026-09-24_002_PSC-UNet"
date = "2026-09-24"
description = "weighted dice + adam + early stopping (14-class)"
runs_dir = "runs"

[dataset]
image_size = 224
batch_size = 8
num_workers = 1

[hyperparameters]
learning_rate = 0.0001
weight_decay = 0.0001
num_epochs = 300
momentum = 0.9
optimizer = "adam"

[model]
base_dim = 32
class_nums = 14
in_channels = 1
swin_depths = [1, 1, 1, 1]
repeat_gray_to_rgb = false

[train]
data_dir = "data/synapse_processed"
device = "cuda"
class_metrics_every = 10
class_metrics_splits = ["val", "train"]
# best.pth / early stopping 按论文 8 器官平均 Dice
val_metric_class_ids = [1, 2, 3, 4, 6, 7, 8, 11]
# 训练仍用 14 类；权重对应 class 1..13，提高胰腺/胆囊/肾上腺等稀有类
dice_class_weights = [1, 1, 1, 2.5, 2.5, 0.5, 1, 1.5, 1.5, 2.5, 5, 4, 4]
early_stopping_patience = 50
early_stopping_min_delta = 0.0

[test]
data_dir = "data/synapse_processed"
device = "cuda"
splits = ["train", "val", "test"]
save_predictions = true
save_predictions_splits = ["train", "val", "test"]
save_visualizations = true
save_visualizations_splits = ["train", "val", "test"]
visualize_num = 100
