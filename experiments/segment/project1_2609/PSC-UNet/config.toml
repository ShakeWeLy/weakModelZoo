[experiments]
name = "2026-09-23_001_PSC-UNet"
date = "2026-09-23"
description = "first psc-unet experiment"
runs_dir = "runs"

[dataset]
image_size = 224
batch_size = 8
num_workers = 1

[hyperparameters]
learning_rate = 0.0001
weight_decay = 0.0001
num_epochs = 300
momentum = 0.9
optimizer = "adam"

[model]
base_dim = 32
class_nums = 14
in_channels = 1
swin_depths = [1, 1, 1, 1]
repeat_gray_to_rgb = false

[train]
data_dir = "data/synapse_processed"
device = "cuda"
class_metrics_every = 10
class_metrics_splits = ["val", "train"]

[test]
data_dir = "data/synapse_processed"
device = "cuda"
splits = ["train", "val", "test"]
save_predictions = true
save_predictions_splits = ["val"]
save_visualizations = true
save_visualizations_splits = ["val", "test"]
visualize_num = 5
