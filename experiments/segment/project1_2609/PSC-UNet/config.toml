[experiments]

name = "2026-09-24_003_PSC-UNet_V4"

date = "2026-09-24"

description = "Dice + CE with weighted dice: standard shuffle, no skip_absent_classes, no guaranteed_sampling."

runs_dir = "runs"



[dataset]

image_size = 224

batch_size = 8

num_workers = 1



[hyperparameters]

learning_rate = 0.0001

weight_decay = 0.0001

num_epochs = 300

momentum = 0.9

optimizer = "adam"



[model]

base_dim = 32

class_nums = 9

in_channels = 1

swin_depths = [1, 1, 1, 1]

repeat_gray_to_rgb = false

# 将原始 14 类 GT 映射为 9 类（背景 + 8 器官）；非 8 器官像素视为背景

label_map = "eval8"



[train]

data_dir = "data/synapse_processed"

device = "cuda"

class_metrics_every = 10

class_metrics_splits = ["val", "train"]

# 模型空间 class 1..8，对应 spleen/rk/lk/gb/liver/stomach/aorta/pancreas

val_metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]

metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]

dice_class_weights = [1, 1, 1, 2.5, 1, 1, 1.5, 5]

# 组合损失: loss = dice_loss_weight * Dice + ce_loss_weight * CE

dice_loss_weight = 1.0

ce_loss_weight = 1.0

# CE 类别权重；未设置时自动使用 [1.0] + dice_class_weights

# ce_class_weights = [1, 1, 1, 1, 2.5, 1, 1, 1.5, 5]

skip_absent_classes = false

guaranteed_sampling = false

early_stopping_patience = 50

early_stopping_min_delta = 0.0



[test]

data_dir = "data/synapse_processed"

device = "cuda"

splits = ["train", "val", "test"]

save_predictions = true

save_predictions_splits = ["train", "val", "test"]

save_visualizations = true

save_visualizations_splits = ["train", "val", "test"]

visualize_num = 100


