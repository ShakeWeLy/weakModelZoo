[dataset]
image_size = 224
batch_size = 8
num_workers = 1

[hyperparameters]
learning_rate = 0.05
weight_decay = 0.0001
num_epochs = 300
momentum = 0.9
optimizer = "sgd"

[model]
hidden_channels = 64
class_nums = 14

[train]
data_dir = "data/synapse_processed"
output_dir = "experiments/segment/project1_2609/UNet/outputs"
device = "cuda"
save_every = 50

[test]
data_dir = "data/synapse_processed"
checkpoint = "experiments/segment/project1_2609/UNet/outputs/best_unet.pth"
output_dir = "experiments/segment/project1_2609/UNet/outputs/analysis"
device = "cuda"
splits = ["val", "test"]
save_predictions = true
save_visualizations = true
visualize_num = 5