[experiments]
name = "2026-09-25_001_UNet_V5"
date = "2026-09-25"
description = "Add guaranteed_sampling and min_samples_per_group_per_epoch options to ensure that each epoch contains at least one slice of each guaranteed class group."
runs_dir = "runs"

[dataset]
image_size = 224
batch_size = 8
num_workers = 1

[hyperparameters]
learning_rate = 0.0001
weight_decay = 0.0001
num_epochs = 300
momentum = 0.9
optimizer = "adam"

[model]
hidden_channels = 64
class_nums = 9
# 将原始 14 类 GT 映射为 9 类（背景 + 8 器官）；非 8 器官像素视为背景
label_map = "eval8"

[train]
data_dir = "data/synapse_processed"
device = "cuda"
class_metrics_every = 10
class_metrics_splits = ["val", "train"]
# 模型空间 class 1..8，对应 spleen/rk/lk/gb/liver/stomach/aorta/pancreas
val_metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]
metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]
dice_class_weights = [1, 1, 1, 1, 1, 1, 1, 1]
early_stopping_patience = 50
early_stopping_min_delta = 0.0
# 保证每个 epoch 都包含胆囊/胰腺/肾上腺切片（按原始标签 ID 检测）
guaranteed_sampling = true
guaranteed_class_groups = [[4], [11]]
# 每个类别组每 epoch 至少采样的切片数，默认等于 batch_size
min_samples_per_group_per_epoch = 8
sampler_seed = 42

[test]
data_dir = "data/synapse_processed"
device = "cuda"
splits = ["train", "val", "test"]
save_predictions = true
save_predictions_splits = ["train", "val", "test"]
save_visualizations = true
save_visualizations_splits = ["train", "val", "test"]
visualize_num = 100
