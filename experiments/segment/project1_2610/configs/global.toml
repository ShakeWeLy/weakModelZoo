# 全局配置：所有模型共享。configs/models/<model>.toml 中的同名键会覆盖这里的值。
# 合并顺序: global → model → global.[quick] → model.[quick]（仅 --quick）→ CLI --epochs / --set

[experiments]
runs_dir = "runs"   # 相对 project1_2610/<model.display_name>/，也可写绝对路径
date = ""           # 留空 = 运行当天

[dataset]
# weakUnet_Synapse：data_dir/train_npz/*.npz（训练/验证）+ data_dir/test_vol_h5/*.npy.h5（测试）
# 标签 0..8 = 背景, spleen, right_kidney, left_kidney, gallbladder, liver, stomach, aorta, pancreas
data_dir = "data/weakUnet_Synapse"
list_dir = "data/weakUnet_Synapse_lists"   # train.txt / test_vol.txt
val_holdout_cases = 2        # 从 train.txt 按病例随机留出的验证病例数
split_seed = 42
image_size = 224
batch_size = 8
num_workers = 1
augment = true               # 训练集 RandomGenerator：rot90+flip 或 ±20° 旋转

[hyperparameters]
optimizer = "adam"           # sgd / adam / adamw
learning_rate = 0.0001
weight_decay = 0.0001
momentum = 0.9               # 仅 sgd
num_epochs = 300
lr_scheduler = "none"        # none / step / poly / cosine / plateau
# lr_min = 1e-6              # cosine / plateau
# lr_step_size = 50          # step
# lr_gamma = 0.5             # step
# lr_poly_power = 0.9        # poly

[train]
device = "cuda"
seed = 42
amp = false
grad_clip_norm = 0.0         # 0 = 不裁剪
limit_batches = 0            # >0 时每个 epoch 只跑前 N 个 batch（调试用）
# best checkpoint 与早停依据这些类别的 val Dice
metric_class_ids = [1, 2, 3, 4, 5, 6, 7, 8]
class_metrics_every = 10
class_metrics_splits = ["val", "train"]
# loss = dice_loss_weight * Dice + ce_loss_weight * CE
dice_loss_weight = 1.0
ce_loss_weight = 1.0
dice_class_weights = []      # 空 = 等权；否则 8 个值（类别 1..8）
ce_class_weights = []        # 空 = [1.0] + dice_class_weights（或等权）；否则 9 个值
skip_absent_classes = true
# 每 epoch 保证包含指定类别的切片（4=胆囊, 8=胰腺）
guaranteed_sampling = false
guaranteed_class_groups = [[4], [8]]
min_samples_per_group_per_epoch = 8
early_stopping_patience = 50
early_stopping_min_delta = 0.0

[test]
device = "cuda"
checkpoint = "best"          # best / last
splits = ["train", "val", "test"]
save_predictions = true
save_predictions_splits = ["train", "val", "test"]
save_visualizations = true
save_visualizations_splits = ["train", "val", "test"]
visualize_num = 100
target_slices = []

# --quick：快速冒烟测试
[quick.hyperparameters]
num_epochs = 2

[quick.train]
limit_batches = 5
class_metrics_every = 1

[quick.test]
splits = ["val"]
visualize_num = 3
