# PSC-UNet：ResNet + Swin 双分支。未写的键沿用 configs/global.toml。

[experiments]
name = "2026-10-08_001_PSC-UNet_V1"
description = "PSC-UNet | Dice + CE | Adam 1e-4 + cosine"

[model]
arch = "psc_unet"
display_name = "PSC-UNet"
repeat_gray_to_rgb = false   # 开关：灰度输入是否复制为 3 通道（false = 1 通道输入）

[model.params]
base_dim = 32                # 基础通道数
swin_depths = [1, 1, 1, 1]   # 各 stage 的 Swin block 数
dropout = 0.15

[hyperparameters]
weight_decay = 0.001
lr_scheduler = "cosine"
lr_min = 0.000001

[train]
early_stopping_patience = 80 # 早停耐心值（早停开关沿用 global.toml 的 early_stopping = true）

[dataset]
num_workers = 0

[quick.model.params]
base_dim = 16
