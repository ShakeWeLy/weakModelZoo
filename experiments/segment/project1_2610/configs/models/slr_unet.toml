# SLR-UNet：官方 ResNet34（本地 ImageNet 权重、可训）+ SAM3 neck（本地权重、冻结）

[experiments]
name = "2026-10-21_001_SLR-UNet_V1"
description = "SLR-UNet | ResNet34 local pretrained + SAM3 frozen | Dice + CE | Adam 1e-4"

[model]
arch = "slr_unet"
display_name = "SLR-UNet"
# 官方 ResNet / SAM 均为 3 通道，灰度需复制为 RGB
repeat_gray_to_rgb = true

[model.params]
hidden_channels = 64
resnet_name = "resnet34"
resnet_pretrained = true
# 相对仓库根目录；见 pretrained_weights/README.md
resnet_weights = "pretrained_weights/resnet/resnet34-b627a593.pth"
# ModelScope 下载后的 sam3.pt；若尚未下载可先运行:
#   python pretrained_weights/download_sam3.py
# 然后再把下面路径改成打印出的实际路径（通常含 facebook/sam3/）
sam_checkpoint = "pretrained_weights/sam3/facebook/sam3/sam3.pt"
sam_load_from_hf = false
sam_hf_version = "sam3"
freeze_sam = true
sam_resolution = 1008

[hyperparameters]
weight_decay = 0.0001
lr_scheduler = "cosine"
lr_min = 0.000001

[train]
early_stopping_patience = 50

[dataset]
batch_size = 2
num_workers = 0

[quick.model.params]
hidden_channels = 32
# 冒烟可不加载 SAM 权重（路径不存在时请临时清空 sam_checkpoint）
# sam_checkpoint = ""
resnet_pretrained = true

[quick.dataset]
batch_size = 1
