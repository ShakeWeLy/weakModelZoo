# UNet baseline。未写的键沿用 configs/global.toml。

[experiments]
name = "2026-10-08_001_UNet_V1"
description = "UNet baseline | Dice loss only | SGD 0.01 + poly | 300 epochs, no early stopping"

[model]
arch = "unet"
display_name = "UNet"

[model.params]
hidden_channels = 64         # 基础通道数

[hyperparameters]
optimizer = "sgd"
learning_rate = 0.01
momentum = 0.9
weight_decay = 0.0001
num_epochs = 300
lr_scheduler = "poly"

[train]
dice_loss_weight = 1.0
ce_loss_weight = 0.0         # 设为 0：关闭 CE 项，仅使用 Dice 损失
skip_absent_classes = false  # 关闭：缺失类也参与 Dice 平均
early_stopping = false       # 关闭早停，训练满 num_epochs

[quick.model.params]
hidden_channels = 16
