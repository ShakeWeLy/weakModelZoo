[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weakModelZoo"
version = "0.2.0"
description = "Weak supervision model zoo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
